</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 60}, &quot;active&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;invoices&quot;, &quot;pi&quot;, &quot;draws&quot;, &quot;settings&quot;, &quot;&quot;], &quot;default&quot;: &quot;invoices&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "";
    const on = "var(--nw-white-sand)", off = "rgba(247,245,236,0.6)";
    const line = "var(--nw-stone-blue)", none = "transparent";
    return {
      invColor: active === "invoices" ? on : off,
      invLine: active === "invoices" ? line : none,
      piColor: active === "pi" ? on : off,
      piLine: active === "pi" ? line : none,
      drawColor: active === "draws" ? on : off,
      drawLine: active === "draws" ? line : none,
      setColor: active === "settings" ? on : "rgba(247,245,236,0.6)",
    };
  }
}
</script>
